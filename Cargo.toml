[package]
name = "oh-unzip"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-kit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
